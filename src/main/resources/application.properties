spring.application.name=mysql-rest-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:iot26}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
spring.datasource.username=${MYSQL_USER:root}
