name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy alla volta; quelli successivi aspettano invece di annullare quello in corso
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/26webservice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GHCR accetta solo nomi minuscoli
      - name: Nome immagine
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Togli -DskipTests se i test non richiedono un MySQL reale (o usano Testcontainers)
      - name: Build Maven
        run: mvn -B package -DskipTests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configura SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            User $USER
            Port $PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Il compose è versionato nel repository: ogni deploy lo aggiorna sul server.
      # Il file .env (password) resta solo sul server e non viene toccato.
      - name: Copia docker-compose.yml sul server
        run: scp deploy/docker-compose.yml "server:$DEPLOY_DIR/docker-compose.yml"

      - name: Deploy
        run: |
          ssh server "cd '$DEPLOY_DIR' && IMAGE_TAG='$GITHUB_SHA' bash -s" <<'EOF'
          set -euo pipefail
          docker network inspect apps >/dev/null
          docker compose pull app
          # --wait attende che tutti i container siano "healthy" (healthcheck nel compose)
          if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
            docker compose ps
            docker compose logs --tail=200 app
            exit 1
          fi
          # rimuove le immagini non usate più vecchie di 7 giorni
          docker image prune -af --filter "until=168h"
          EOF
