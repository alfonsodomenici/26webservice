# Da aggiungere a haproxy.cfg del container HAProxy (anch'esso sulla rete "apps").

# DNS interno di Docker: necessario perché a ogni deploy il container
# viene ricreato e cambia IP. Senza resolvers HAProxy risolve il nome
# solo all'avvio e continuerebbe a puntare al vecchio IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold obsolete   10s

frontend https_in
    # ... bind 443 ssl crt ..., le tue regole esistenti ...
    http-request set-header X-Forwarded-Proto https
    acl host_26webservice hdr(host) -i 26webservice.tssdev.it
    # non esporre Actuator su internet
    http-request deny if host_26webservice { path_beg /actuator }
    use_backend be_26webservice if host_26webservice

backend be_26webservice
    option httpchk
    http-check send meth GET uri /actuator/health
    http-check expect status 200
    # init-addr: HAProxy si avvia anche se il container non esiste ancora
    server app1 26webservice:8080 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none
